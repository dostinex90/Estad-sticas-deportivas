# Cada día: descarga los partidos nuevos, pasa las pruebas, regenera los informes de informes/
# y publica la versión web en GitHub Pages. No usa IA. En repositorios públicos es gratuito.
name: Actualización diaria

on:
  schedule:
    - cron: "17 9 * * *"  # 09:17 UTC todos los días
  workflow_dispatch:       # botón "Run workflow" para lanzarla a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar la base de datos
        run: python -m analisis_deportivo recopilar

      # Las temporadas terminadas de football-data.co.uk se guardan aunque falle algo después,
      # para no tener que volver a descargarlas.
      - name: Guardar los archivos descargados de football-data.co.uk
        run: |
          if [ ! -d datos/football_data ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/football_data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archivos de football-data.co.uk $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Verificar la integridad de los datos
        run: python scripts/verificar_datos.py

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: Generar informes
        run: python scripts/generar_informes.py

      - name: Guardar los informes en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informes
          if git diff --cached --quiet; then
            echo "Los informes no han cambiado."
            exit 0
          fi
          git commit -m "Informes automáticos $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Generar la web
        run: python scripts/generar_sitio.py sitio

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      # La base actualizada se guarda como descarga del propio workflow (30 días) en lugar de
      # subirla al repositorio cada día, para que el historial de git no crezca 18 MB diarios.
      - name: Guardar la base actualizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-deportiva
          path: datos/base_deportiva.sqlite.gz
          if-no-files-found: ignore
          retention-days: 30

  # Publicar va en un trabajo aparte: si GitHub Pages no está activado (Settings → Pages →
  # Source: GitHub Actions), solo falla este paso y los informes se actualizan igual.
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
